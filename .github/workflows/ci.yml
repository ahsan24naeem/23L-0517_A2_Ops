name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pytest==9.2.0 flake8==7.5.0
      - name: Lint (flake8)
        run: flake8 visionguard app api tests scripts labs
      - name: Unit tests (pytest)
        run: pytest -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: 23l-0517_a2_ops-web:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker image ls 23l-0517_a2_ops-web:ci
          docker run --rm 23l-0517_a2_ops-web:ci sh -c 'whoami && python -c "import tensorflow as tf, app, api; print(tf.__version__)"'
# Secrets (e.g. a registry token for pushing images) live in
# GitHub -> Settings -> Secrets and variables -> Actions and are referenced as ${{ secrets.NAME }}.
# They are never written in this file because the workflow file is public and versioned.
